# Power Mining Configuration

# Mounted Mining Settings
mounted-mining:
  enabled: true
  # Mining area dimensions (blocks in each direction from center)
  # 3x3x3 means 1 block in each direction = 3 total per axis
  radius-x: 1
  radius-y: 1
  radius-z: 1
  # How often to mine (in ticks, 20 ticks = 1 second)
  mining-interval: 5
  # Y offset to prevent mining below the mount (positive = higher)
  y-offset: 1

# Magnet Hopper Settings
magnet-hopper:
  enabled: true
  # Default attraction radius in blocks
  default-radius: 8
  # Maximum allowed radius
  max-radius: 32
  # How often to attract items (in ticks)
  attraction-interval: 5
  # Item attraction speed (blocks per tick)
  attraction-speed: 0.5
  # Particle effect settings
  particles:
    enabled: true
    type: SOUL_FIRE_FLAME
    count: 3
    interval: 10

# Ore Scanner Bell Settings
ore-scanner-bell:
  enabled: true
  # Default scanning radius in blocks
  default-radius: 16
  # Maximum allowed radius
  max-radius: 64
  # Default highlight duration (in ticks, 20 ticks = 1 second)
  default-duration: 60
  # Cooldown between uses (in seconds)
  cooldown: 30
  # List of blocks that count as ores
  ore-types:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS

# Miner's Helmet Settings
miners-helmet:
  enabled: true

# Escape Rope Settings
escape-rope:
  enabled: true

# Cave Compass Settings
cave-compass:
  enabled: true
  # Maximum distance to search for structures (in blocks)
  search-radius: 5000

# Auto-Smelter Pickaxe Settings
auto-smelter-pickaxe:
  enabled: true

# Miner's Goggles Settings
miners-goggles:
  enabled: true
  # Default reveal radius (in blocks)
  default-radius: 10
  # Minimum reveal radius
  min-radius: 5
  # Maximum reveal radius
  max-radius: 20
  # How often to refresh ore highlights (in ticks, 20 = 1 second)
  highlight-interval: 20
  # Highlight glow color (uses scoreboard team colors)
  # Options: BLACK, DARK_BLUE, DARK_GREEN, DARK_AQUA, DARK_RED, DARK_PURPLE,
  #          GOLD, GRAY, DARK_GRAY, BLUE, GREEN, AQUA, RED, LIGHT_PURPLE, YELLOW, WHITE
  highlight-color: GOLD
  # List of detectable ore types (when no filter is applied)
  ore-types:
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - NETHER_GOLD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS

# Messages (supports MiniMessage format)
messages:
  magnet-hopper-given: "<green>You received a <gold>Magnet Hopper</gold> with radius <yellow>{radius}</yellow>!</green>"
  ore-scanner-bell-given: "<green>You received an <gold>Ore Scanner Bell</gold> with radius <yellow>{radius}</yellow>!</green>"
  ore-scanner-cooldown: "<red>Ore Scanner is on cooldown! <yellow>{seconds}</yellow> seconds remaining.</red>"
  ore-scanner-found: "<green>Found <yellow>{count}</yellow> ores nearby!</green>"
  ore-scanner-none-found: "<yellow>No ores found in range.</yellow>"
  miners-helmet-given: "<green>You received a <gold>Miner's Helmet</gold>! Wear it for night vision.</green>"
  escape-rope-given: "<green>You received an <light_purple>Escape Rope</light_purple>! Right-click a block to set return point.</green>"
  escape-rope-set: "<green>Return point set! Right-click in the air to teleport back.</green>"
  escape-rope-teleport: "<green>Whoosh! You've been teleported back to your return point!</green>"
  escape-rope-no-point: "<red>No return point set! Right-click a block first.</red>"
  escape-rope-invalid: "<red>Return point is no longer valid!</red>"
  cave-compass-given: "<green>You received a <light_purple>Cave Compass</light_purple>! Shift+Right-click to cycle targets.</green>"
  smelter-pickaxe-given: "<green>You received a <red>Smelter's Pickaxe</red>! Ores are auto-smelted when mined.</green>"
  miners-goggles-given: "<green>You received <gold>Miner's Goggles</gold>! Ores within <yellow>{radius}</yellow> blocks will glow when worn.</green>"
  no-permission: "<red>You don't have permission to do that!</red>"
